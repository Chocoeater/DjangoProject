{% extends 'mailing_base.html' %}

{% block title %}Список сообщений{% endblock %}

{%block content %}
<div class="row">
    <div class="col-2"></div>
    {% for message in messages %}
    <div class="card m-3" style="width: 18rem;">
        <div class="card-body">
            <h5 class="card-title">{{ message.subject }}</h5>
            <p class="card-subtitle mb-2 text-body-secondary">{{ message.body | truncatechars:50}}</p>
            <a href="{% url 'mailing:message' message.pk %}" class="card-link">Подробнее</a>
            <a href="#" class="card-link">Another link</a>
        </div>
    </div>
    {% endfor %}
    <div class="col-2"></div>
</div>
{% endblock %}
