<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Skystore</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="/">Каталог</a>
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="/contacts/">Контакты</a>
        <a class="p-2 btn btn-outline-primary" href="/add/">Добавить товар</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'blog:records_list' %}">Блог</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'mailing:home' %}">Рассылки</a>
        {% endif %}
    </nav>
    <div class="ms-auto d-flex align-items-center gap-2">
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:profile' user.pk %}">Профиль</a>
        <form method="post" action="{% url 'users:logout' %}">
            {% csrf_token %}
            <button class="p-2 btn btn-outline-primary" type="submit">Выход</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:registration' %}">Регистрация</a>
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
        {% endif %}
    </div>
</div>
