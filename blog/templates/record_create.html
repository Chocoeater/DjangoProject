{% extends 'base_blog.html' %}

{% block title %}Создать запись{% endblock %}

{% block content %}
<form method="post" enctype="multipart/form-data">
    <div class="row">
        <div class="col-3"></div>
    <div class="col-6">
        <h1>Создайте запись</h1>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Опубликовать</button>
    </div>
    <div class="col-3"></div>
    </div>
</form>
{% endblock %}
