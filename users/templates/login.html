<style>
    label {
        font-weight: bold;
    }
</style>

{% extends 'base.html' %}

{% block title%}Вход{% endblock %}
{% block content %}
<div class="row text-center">
    <form method="post">
        <div class="row">
            <div class="col-3"></div>
            <div class="col-6">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-success" type="submit">Войти</button>
                <a href="{% url 'users:reset' %}" class="btn btn-link">Забыли пароль?</a>
            </div>
            <div class="col-3"></div>
        </div>
    </form>
</div>
{% endblock %}
