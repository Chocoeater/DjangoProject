<style>
    label {
        font-weight: bold;
    }
</style>

{% extends 'base.html' %}

{% block title%}Регистрация{% endblock %}
{% block content %}
<div class="row ">
    <form method="post" enctype="multipart/form-data">
        <h2 class="text-center">Регистрация</h2>
        <div class="row">
            <div class="col-3"></div>
            <div class="col-6">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-success" type="submit">Регистрация</button>
            </div>
            <div class="col-3"></div>
        </div>
    </form>
</div>
{% endblock %}
